<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudMusic</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: #121212;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      main {
        flex: 1;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .join-banner {
        background-color: #181818;
        border-radius: 12px;
        padding: 50px 40px;
        text-align: center;
        width: 100%;
        max-width: 560px;
      }

      .join-title {
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.4;
        margin-bottom: 20px;
      }

      .join-link {
        display: inline-block;
        font-size: 14px;
        color: #b3b3b3;
        text-decoration: none;
        transition: color 0.2s;
      }

      .join-link:hover {
        color: #ffffff;
        text-decoration: underline;
      }

      .footer {
        background-color: #0a0a0a;
        border-top: 1px solid #222;
        padding: 40px 24px 20px;
        width: 100%;
        margin-top: auto;
      }

      .footer-content {
        max-width: 1200px;
        margin: 0 auto 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
      }

      .footer-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 700;
      }

      .footer-links a {
        color: #aaa;
        text-decoration: none;
        margin-right: 20px;
        font-size: 14px;
      }

      .footer-links a:hover {
        color: #fff;
      }

      .footer-bottom {
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid #222;
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="logo">
          <a href="Trangchinh.html">
            <img src="images/logo.png" alt="CloudMusic" class="logo-img" />
          </a>
        </div>
        <div class="nav-left">
          <a href="Trangchinh.html">Home</a>
          <a href="feed.html" class="active">Feed</a>
          <a href="Thuvien.html">Library</a>
        </div>
        <div class="search-box">
          <input type="text" placeholder="Search" />
          <span class="search-icon">🔍</span>
        </div>
        <div class="nav-right">
          <a href="#">Upload</a>
          <a href="login.html" class="login-btn">Login</a>
          <a href="Createaccount.html" class="create-account"
            >Create a account</a
          >
          <span class="icon">🔔</span>
          <span class="icon">✉️</span>
          <span class="icon">⋯</span>
        </div>
      </div>
    </header>
    <main>
      <div class="join-banner">
        <h2 class="join-title">
          Join CloudMusic to hear the latest from people you follow
        </h2>
        <a href="login.html" class="join-link">Login / Create an account</a>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-logo">
          <div class="logo-icon">?</div>
          <span>CloudMusic</span>
        </div>
        <div class="footer-links">
          <a href="#">Giới thiệu</a>
          <a href="#">Liên hệ</a>
          <a href="#">Chính sách</a>
          <a href="#">Điều khoản</a>
          <a href="#">Trợ giúp</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 CloudMusic. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
