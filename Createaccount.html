<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Login - CloudMusic</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-container">
      <h1 class="main-title">Sign in or create an account</h1>
      <button class="social-btn facebook">
        <span class="icon">F</span> Continue with Facebook
      </button>
      <button class="social-btn google">
        <span class="icon">G</span> Continue with Google
      </button>
      <button class="social-btn apple">
        <span class="icon">🍎</span> Continue with Apple
      </button>
      <div class="divider">
        <span>or</span>
      </div>
      <form class="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required />
        <button type="submit" class="continue-btn">Continue</button>
        <div class="create-account-wrap">
          <a href="login.html" class="create-account-link"
            >Already have an account? Login</a
          >
        </div>
      </form>
    </div>
  </body>
</html>
